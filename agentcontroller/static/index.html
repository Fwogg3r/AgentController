<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<link rel="icon" href="data:,">
<title>Agents</title>
<style>
/* Claude Code's terminal look: dark always. */
:root {
  --bg:#141413; --card:#1E1E1C; --ink:#E8E6E1; --muted:#8B8983; --line:#2E2D2A; --accent:#D97757; --accent-d:#C4623F;
  --bubble:transparent; --user:#2C2B28; --tool:transparent; --ok:#4EBA65; --bad:#FF6B80; --warn:#E5C07B;
  --shadow:none; color-scheme:dark;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--ink); height:100vh; height:100dvh; display:flex; flex-direction:column;
  font:13.5px/1.5 ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace; }
code,pre,.mono { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:12.5px; }
header { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; position:relative; }
header h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.2px; }
.spend { display:flex; gap:14px; align-items:center; flex:1; min-width:260px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
.bar { width:140px; height:8px; border-radius:6px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s; }
.bar.hot i { background:var(--bad); }
button { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px;
  padding:5px 11px; cursor:pointer; box-shadow:var(--shadow); }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary.armed { background:var(--accent-d); outline:2px solid var(--accent); }
button.danger:hover:not(:disabled) { border-color:var(--bad); color:var(--bad); }
button.sm { font-size:11.5px; padding:1px 8px; border-radius:8px; }
a { color:var(--accent); }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; border:1px solid var(--line); border-radius:20px; padding:0 8px; color:var(--muted); background:var(--card); }
.chip b { color:var(--ink); font-weight:600; }
.chip.on { border-color:var(--ok); }
#lmchips { display:flex; gap:6px; flex-wrap:wrap; }
#attn { position:relative; }
#attn .badge { background:var(--bad); color:#111; border-radius:20px; padding:0 7px; font-size:11.5px; margin-left:4px; font-weight:700; }
#attn.zero .badge { background:var(--line); color:var(--muted); }
#attn-pop { position:absolute; right:14px; top:100%; z-index:20; width:min(440px,94vw); max-height:60vh; overflow:auto; background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:6px; display:flex; flex-direction:column; gap:4px; }
.attn-item { display:grid; grid-template-columns:24px 1fr; gap:8px; align-items:center; padding:6px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
.attn-item:hover { border-color:var(--accent); }
.attn-item .k { font-size:11px; color:var(--warn); }
.attn-item .t { font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attn-item .pj { font-size:11px; color:var(--muted); }
main { flex:1; display:flex; min-height:0; }
#side { width:270px; flex:none; overflow:auto; scrollbar-gutter:stable; min-width:0; padding:10px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
#runs { display:flex; flex-direction:column; gap:8px; min-width:0; }
#sidewrap { position:relative; display:flex; flex:none; min-height:0; }
#grip { position:absolute; top:0; right:-3px; width:7px; height:100%; cursor:col-resize; z-index:5; }
#grip:hover, #grip.drag { background:var(--accent); opacity:.35; }
/* projects */
#side > * { flex:none; }
#projects { display:flex; flex-direction:column; gap:3px; padding-bottom:8px; border-bottom:1px solid var(--line); max-height:34vh; overflow:auto; }
.proj { display:grid; grid-template-columns:10px 1fr auto; gap:6px; align-items:center; padding:4px 8px; border-radius:10px; cursor:pointer; border:1px solid transparent; position:relative; }
.proj:hover { background:var(--card); }
.proj.sel { border-color:var(--accent); background:var(--card); }
.proj .dot { width:8px; height:8px; border-radius:50%; background:var(--line); }
.proj .dot.live { background:var(--ok); box-shadow:0 0 6px var(--ok); }
.proj .pn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.proj .cnt { font-size:11px; display:flex; gap:5px; }
.proj .cnt .w { color:var(--ok); } .proj .cnt .a { color:var(--warn); } .proj .cnt .c { color:var(--bad); }
.proj .sub { grid-column:2 / -1; font-size:11px; color:var(--muted); display:flex; gap:8px; justify-content:space-between; }
.proj .fg { display:none; }
.proj:hover .fg { display:inline-block; }
.proj .fg { font-size:10.5px; padding:0 6px; border-radius:6px; }
.run { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:9px 10px; cursor:pointer; box-shadow:var(--shadow);
  display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:center; position:relative; }
.run.sel { border-color:var(--accent); }
.run > * { min-width:0; }
.run .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run .meta { color:var(--muted); font-size:12px; }
.pill { display:inline-block; font-size:11px; padding:0 7px; border-radius:20px; color:#111; }
.pill.working { background:var(--ok); } .pill.waiting { background:var(--warn); } .pill.finished { background:var(--muted); }
.pill.oneshot { background:transparent; border:1px solid var(--accent); color:var(--accent); margin-right:4px; }
.pill.tag { background:transparent; border:1px solid var(--tagc, var(--muted)); color:var(--tagc, var(--muted)); margin-right:4px; }
.pill.prj { background:var(--line); color:var(--muted); margin-right:4px; }
.pill.finished.max_tokens, .pill.finished.refusal { background:var(--warn); }
.pill.crashed { background:var(--bad); } .pill.ended { background:var(--line); color:var(--muted); }
.pill.finished.max_turns, .pill.finished.budget { background:var(--warn); } .pill.finished.error { background:var(--bad); }
.pill.planned { background:var(--line); color:var(--ink); } .pill.active { background:var(--accent); } .pill.done { background:var(--ok); }
.run .act { font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; grid-column:1 / -1; }
.run .act .g { color:var(--accent); display:inline-block; width:2ch; text-align:center; margin-right:0.5ch; }
.run .tog { position:absolute; left:2px; top:2px; font-size:11px; line-height:1; padding:1px 3px; border-radius:6px; background:var(--bg); color:var(--muted); }
/* hierarchy: file-tree connectors */
.node { display:flex; flex-direction:column; gap:8px; min-width:0; }
.node.child { position:relative; margin-left:12px; padding-left:14px; }
.node.child::before { content:""; position:absolute; left:0; top:0; width:12px; height:24px; border-left:1px solid var(--muted); border-bottom:1px solid var(--muted); border-radius:0 0 0 6px; opacity:.6; }
.node.child:not(.last)::after { content:""; position:absolute; left:0; top:24px; bottom:-8px; border-left:1px solid var(--muted); opacity:.6; }
.node > .kids { display:flex; flex-direction:column; gap:8px; }
.node.hasKids > .run::after { content:""; position:absolute; left:17px; top:100%; height:8px; border-left:1px solid var(--muted); opacity:.6; }
.node.collapsedN > .run::after { display:none; }
#filters { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); padding-bottom:6px; border-bottom:1px solid var(--line); }
#filters input[type=text], #filters input[type=number] { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:6px; padding:3px 6px; width:100%; }
#filters input[type=number] { width:56px; }
#filters label { display:flex; align-items:center; gap:5px; cursor:pointer; }
#filters .two { display:flex; flex-wrap:wrap; gap:2px 10px; }
#models-box { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); padding-bottom:6px; border-bottom:1px solid var(--line); }
#models-box label { display:flex; align-items:center; gap:5px; cursor:pointer; }
#models-box .hd { display:flex; justify-content:space-between; }
#models-box .hd a { cursor:pointer; margin-left:8px; }
/* transcript */
.ln { white-space:pre-wrap; word-break:break-word; padding-left:2ch; text-indent:-2ch; cursor:pointer; }
.ln.sel { background:var(--user); }
.ln .b { color:var(--ink); } .ln.toolln .b { color:var(--ok); } .ln.toolln.err .b { color:var(--bad); } .ln.toolln.open .b { color:var(--ok); display:inline-block; animation:toolpulse 1.2s ease-in-out infinite; }
@keyframes toolpulse { 0%, 100% { opacity:1; transform:scale(1); } 50% { opacity:.25; transform:scale(.7); } }
@media (prefers-reduced-motion: reduce) { .ln.toolln.open .b { animation:none; color:var(--muted); } }
.ln .tn { font-weight:700; }
.res { color:var(--muted); white-space:pre-wrap; word-break:break-word; padding-left:5ch; text-indent:-3ch; max-height:7.5em; overflow:hidden; cursor:pointer; }
.res.full { max-height:none; }
.ln.user { background:var(--user); padding:4px 8px 4px calc(2ch + 8px); color:var(--ink); border-radius:4px; }
details.think { color:var(--muted); font-style:italic; padding-left:2ch; }
details.think summary { cursor:pointer; list-style:none; text-indent:-2ch; }
details.think div { white-space:pre-wrap; word-break:break-word; }
#spinner { padding:6px 14px; min-height:2.2em; border-top:1px solid var(--line); }
#spinner .g { color:var(--accent); display:inline-block; width:2ch; text-align:center; }
#spinner .v { color:var(--accent); }
#spinner .m { color:var(--muted); }
#spinner .x { display:block; color:var(--muted); font-style:italic; padding-left:2ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pane { flex:1; display:flex; flex-direction:column; min-width:0; }
#tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 10px; }
#tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; padding:7px 12px; color:var(--muted); }
#tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
.view { flex:1; display:flex; flex-direction:column; min-height:0; }
.vhead { display:flex; gap:10px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12.5px; }
.vbody { flex:1; overflow:auto; padding:12px 14px; }
#runhead { padding:8px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); display:flex; gap:10px; align-items:flex-start; }
#runhead .ico { flex:none; }
#runhead b { color:var(--ink); }
#runhead .commits { margin-top:2px; white-space:pre-wrap; }
#stream { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.bubble { background:var(--bubble); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px; max-width:92%;
  white-space:pre-wrap; word-break:break-word; box-shadow:var(--shadow); cursor:pointer; }
.bubble.sel { outline:2px solid var(--accent); }
details.tool { background:var(--tool); border-radius:10px; padding:3px 10px; font-size:12.5px; border:1px solid var(--line); }
details.tool summary { cursor:pointer; list-style:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sys { color:var(--muted); font-size:12px; }
.md { line-height:1.55; padding:2px 0 6px; }
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { margin:10px 0 4px; font-size:14px; color:var(--ink); font-weight:700; }
.md h1 { font-size:16px; } .md h2 { font-size:15px; } .md h3 { font-style:italic; } .md h4,.md h5,.md h6 { color:var(--muted); }
.md p { margin:4px 0; } .md ul,.md ol { margin:4px 0; padding-left:22px; } .md li > ul,.md li > ol { margin:2px 0; }
.md a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
.md blockquote { margin:6px 0; padding:0 0 0 10px; border-left:3px solid var(--line); color:var(--muted); }
.md hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
.md .tbl { overflow-x:auto; margin:6px 0; }
.md table { border-collapse:collapse; font-size:inherit; }
.md th,.md td { border:1px solid var(--line); padding:3px 8px; text-align:left; vertical-align:top; }
.md th { background:var(--card); font-weight:700; }
.md .tk { color:var(--muted); } .md .tk.done { color:var(--ok); }
.md :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
.ln.mdln { display:grid; grid-template-columns:2ch minmax(0, 1fr); white-space:normal; text-indent:0; padding-left:0; }
.ln.mdln .md { padding:0; min-width:0; }
.md pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; overflow:auto; white-space:pre; margin:6px 0; }
.md code { background:var(--card); padding:0 4px; border-radius:4px; } .md pre code { background:none; padding:0; }
.promptblk summary { cursor:pointer; color:var(--muted); } .promptblk pre { white-space:pre-wrap; word-break:break-word; margin:4px 0; max-height:40vh; overflow:auto; }
#composer { border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
.qcard { border:1px solid var(--accent); border-radius:10px; padding:8px 10px; margin:6px 0; background:var(--card); }
.qcard.done { border-color:var(--line); opacity:.85; }
.qcard .qh { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-top:6px; }
.qcard .qq { font-weight:600; margin:2px 0 6px; white-space:pre-wrap; }
.qcard .qo { display:flex; gap:8px; align-items:flex-start; padding:4px 6px; border-radius:6px; cursor:pointer; }
.qcard .qo:hover { background:var(--user); }
.qcard .qo small { display:block; color:var(--muted); }
.qcard .qo input { all:revert; flex:none; margin:3px 0 0; accent-color:var(--accent); }
.qcard .qo > div { flex:1; min-width:0; text-align:left; }
.qcard input[type=text] { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; margin-top:4px; box-sizing:border-box; }
.qcard .qa { color:var(--ok); white-space:pre-wrap; margin-top:4px; }
#qdlg { width:min(560px, calc(100vw - 20px)); }
#files { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
#files:empty { display:none; }
#composer.drop { outline:2px dashed var(--accent); }
.rid { font-size:11px; font-style:italic; color:var(--muted); margin:1px 0 3px; }
textarea { width:100%; resize:vertical; min-height:54px; max-height:200px; font:inherit; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.hint { font-size:12px; color:var(--muted); }
#primarybox { padding:8px 14px; border-top:1px dashed var(--line); }
#primarybox summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
dialog { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  padding:16px 18px; width:min(560px,94vw); }
dialog::backdrop { background:rgba(0,0,0,.35); }
dialog h2 { margin:0 0 10px; font-size:16px; }
dialog label { display:block; font-size:12.5px; color:var(--muted); margin:8px 0 2px; }
dialog input, dialog select { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:6px 9px; }
dialog .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
dialog .err { color:var(--bad); font-size:12.5px; min-height:1.2em; margin-top:8px; white-space:pre-wrap; }
dialog .msg { white-space:pre-wrap; margin:6px 0; }
.actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.empty { margin:auto; text-align:center; color:var(--muted); }
/* agent icons: every profile's svg gets the animated states from these shared rules (class "ico" + state class) */
.ico { display:block; }
.ico .eye { fill:var(--eye, #2B1A12); } .ico .zz, .ico .bang { display:none; font:bold 5px monospace; }
.ico.running { animation:bob 1.1s ease-in-out var(--ph1, 0s) infinite; }
.ico.running .leg.a { animation:step 1.1s steps(2) var(--ph1, 0s) infinite; }
.ico.finished .eye { display:none; } .ico .closed { display:none; } .ico.finished .closed { display:block; }
.ico.finished .zz { display:block; fill:var(--muted); animation:zz 2.4s ease-in-out var(--ph2, 0s) infinite; }
.ico.waiting .zz { display:block; fill:var(--warn); animation:zz 2.4s ease-in-out var(--ph2, 0s) infinite; }
.ico.crashed .bang { display:block; fill:var(--bad); }
.ico.crashed { filter:grayscale(.85); opacity:.7; }
.ico.ended { filter:grayscale(.85); opacity:.5; }
@keyframes bob { 50% { transform:translateY(-2px); } }
@keyframes step { 50% { transform:translateY(-1px); } }
@keyframes zz { 50% { opacity:.3; transform:translateY(-1px); } }
/* local run view */
#localview { flex:1; display:none; flex-direction:column; min-height:0; }
#l-top { padding:8px 14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
.gauge { display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--muted); }
.gauge .gb { width:200px; height:10px; border-radius:6px; background:var(--line); overflow:hidden; }
.gauge .gb i { display:block; height:100%; background:var(--ok); }
.gauge .gb.hot i { background:var(--bad); } .gauge .gb.warm i { background:var(--warn); }
.appr { display:flex; gap:8px; align-items:center; flex-wrap:wrap; border:1px solid var(--warn); border-radius:10px; padding:5px 9px; }
.appr .sm { white-space:pre-wrap; word-break:break-word; flex:1; min-width:180px; }
.lcols { flex:1; display:grid; grid-template-columns:1fr 1fr; min-height:0; }
.lpane { overflow:auto; padding:8px 14px; display:flex; flex-direction:column; gap:3px; min-width:0; }
.lpane + .lpane { border-left:1px solid var(--line); }
.lpane h3 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; position:sticky; top:-8px; background:var(--bg); padding:2px 0; }
#l-think { color:var(--muted); font-style:italic; white-space:pre-wrap; word-break:break-word; }
.chunk { white-space:pre-wrap; word-break:break-word; }
.ev { white-space:pre-wrap; word-break:break-word; padding-left:2ch; text-indent:-2ch; }
.ev .b { color:var(--muted); } .ev.ok .b { color:var(--ok); } .ev.bad .b { color:var(--bad); } .ev.warn .b { color:var(--warn); } .ev.acc .b { color:var(--accent); }
.ev pre { margin:2px 0 2px 2ch; text-indent:0; color:var(--muted); white-space:pre-wrap; }
/* roadmap, jobs, models */
.rm { display:flex; gap:12px; align-items:flex-start; overflow:auto; min-height:100%; }
#rm-body.real { padding:0; overflow:hidden; }
#rm-body.real iframe { display:block; width:100%; height:100%; border:0; background:var(--bg, #fff); }
.rmcol { flex:none; width:290px; display:flex; flex-direction:column; gap:8px; }
.rmcol h3 { margin:0; font-size:13px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
.card:hover { border-color:var(--accent); }
.card .ct { font-weight:600; word-break:break-word; }
.card .cm { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--muted); }
.card .body { cursor:auto; border-top:1px solid var(--line); padding-top:4px; font-size:12.5px; }
.card .kids { display:flex; flex-direction:column; gap:6px; margin-left:8px; }
.achip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:20px; padding:0 8px 0 4px; cursor:pointer; background:var(--bg); }
.achip:hover { border-color:var(--accent); }
table.t { border-collapse:collapse; width:100%; font-size:12.5px; margin-bottom:14px; }
table.t th, table.t td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
table.t th { color:var(--muted); font-weight:600; }
.sect { margin:14px 0 6px; font-size:13px; color:var(--accent); }
.host { border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin-bottom:10px; background:var(--card); }
.host h3 { margin:0 0 4px; font-size:14px; }
/* mobile-only pieces are hidden on desktop */
#hmenu { display:contents; }
#attn { order:5; } #who { order:10; }
#menubtn, #mbar, #mtabs, #toolbar, #sheetbg, .sheethd, #psel, .rhx { display:none; }
#fbox { display:contents; }

/* ===== phones: two views (list | detail), bottom tab bar, header menu, filter sheet ===== */

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const usd = n => n == null ? "-" : "$" + Number(n).toFixed(2);

// ============================================================================================================
// AGENT PROFILES: one entry per kind of agent. A row uses the FIRST profile whose match(row) is true; the last
// entry (match: () => true) is the generic fallback. To add a new kind of agent add ONE object here, e.g.
//   { id: "gemma", label: "gemma", tag: "gemma", color: "#4C8DF6",
//     match: r => r.local && /gemma/i.test((r.model || "") + (r.model_id || "")),
//     icon: (state, px) => ico(state, px, `${rect(2,1,7,5,'fill="#4C8DF6"')} ${eyes(3,7,2)}`) }
// Put it BEFORE the entries it should win over (e.g. above "local"). Fields:
//   id     short unique name           label  shown as the provider tag and tooltip
//   tag    text of the tag on run rows color  accent colour (tag border, chips)
//   match  (row) -> bool               row = one item of /api/runs (provider, model, model_id, local, kind, ...)
//   icon   (state, px) -> svg string   state is one of running|waiting|finished|crashed|ended. Build it with
//          ico(state, px, body, {eye}) on an 11x10 grid (viewBox "0 -2 11 10"). The shared class "ico" gives it ALL
//          animations for free: whole body bobs while running; rects with class "leg a" step; <g class="eye"> hides
//          and <g class="closed"> shows when finished; "zz" / "!" overlays appear for waiting / finished / crashed.
//          Helpers: rect(x,y,w,h,attrs), legs(xs,y,fill), eyes(x1,x2,y).
// ============================================================================================================
const rect = (x, y, w, h, a) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${a || ""}/>`;
const legs = (xs, y, fill) => xs.map((x, i) => rect(x, y, 1, 2, `class="leg ${i % 2 ? "b" : "a"}" fill="${fill}"`)).join("");
const eyes = (x1, x2, y) => `<g class="eye">${rect(x1, y, 1, 2, 'class="eye"')}${rect(x2, y, 1, 2, 'class="eye"')}</g>` +
  `<g class="closed">${rect(x1, y + 1, 1, .5, 'class="eye" style="display:block"')}${rect(x2, y + 1, 1, .5, 'class="eye" style="display:block"')}</g>`;
function ico(state, px, body, o) {
  // The run list is rebuilt on every poll; a fresh icon would restart its animation (a visible jump every 4 s),
  // so it starts at the phase a global clock gives it (negative delays: 1.1 s bob/step, 2.4 s zz).
  const now = Date.now(), ph = `--ph1:-${now % 1100}ms;--ph2:-${now % 2400}ms;--eye:${(o && o.eye) || "#2B1A12"}`;
  return `<svg class="ico ${state}" style="${ph}" viewBox="0 -2 11 10" width="${px}" height="${px * 10 / 11}" shape-rendering="crispEdges">` +
    `${body}<text class="zz" x="9" y="0">z</text><text class="bang" x="9.2" y="0.5">!</text></svg>`;
}
const AGENT_PROFILES = [

  const hist = arr(d.runs, "runs", "items", "data");

  box.append(el("div", "sect", `Jobs (${js.length})`));
  if (d.jobs_error) box.append(el("div", "hint", "jobs: " + d.jobs_error));
  box.append(table(["name", "enabled", "trigger", "model / agent", "tagged agents", "runs"], js.map(j => {
    const mine = hist.filter(h => (h.job || h.job_name || h.name) === j.name);
    const pref = j.assigned_agent || j.agent || j.model_preference || j.assigned_model || j.model || "";
    const agents = el("span");
    for (const n of j.agents || []) { const run = allRuns.find(r => r.name === n); agents.append(run ? agentChip(run.project, n) : el("span", "chip", n)); agents.append(" "); }
    return [j.name || j.id, j.enabled === false ? "no" : "yes", trigSummary(j), short(pref), agents, hist.length || d.runs ? String(mine.length) : "-"];
  })));
  const ws = arr(d.watches, "watches", "items", "data");
  box.append(el("div", "sect", `Watches (${ws.length})`));
  if (d.watches_error) box.append(el("div", "hint", "watches: " + d.watches_error));
  box.append(table(["id", "status", "kind", "created", "what"], ws.map(w => [short(w.id), short(w.status), short(w.kind || w.type), short(w.created || w.created_at), short(w.title || w.name || w.description || w.prompt).slice(0, 100)])));
  const ap = arr(d.approvals, "approvals", "items", "data").filter(a => !a.status || a.status === "pending");
  box.append(el("div", "sect", `Pending approvals (${ap.length})`));
  if (d.approvals_error) box.append(el("div", "hint", "approvals: " + d.approvals_error));
  box.append(table(["id", "what", "link"], ap.map(a => {
    const id = a.id != null ? String(a.id) : "", link = el("span");
    if (url && id) { const x = el("a", "", "open in pmjc"); x.href = url + "/approve/" + encodeURIComponent(id); x.target = "_blank"; x.rel = "noopener noreferrer"; link.append(x); }
    return [id, short(a.summary || a.title || a.tool || a.description || a.action), link];
  })));
}
setInterval(() => { if (tab === "jobs") loadJobs(); }, 15000);

// ---- models tab + header chips ----
const loadedOf = h => (h.models || []).filter(m => m.state === "loaded");
function drawChips() {
  const box = $("#lmchips"); box.textContent = "";
  for (const [name, h] of Object.entries(lms)) {
    const ld = h.ok ? loadedOf(h) : [], c = el("span", "chip" + (ld.length ? " on" : ""));
    c.append(el("span", "", name + ":"), el("b", "", !h.ok ? "off" : ld.length ? ld.map(m => m.id).join(", ") : "idle"));
    c.title = h.ok ? (h.url || "") : (h.error || "unreachable"); box.append(c);
  }
}
function drawModelsTab() {
  const box = $("#models-body"); box.textContent = "";
  const hs = Object.entries(lms);
  if (!hs.length) { box.append(el("div", "empty", "No LM Studio hosts configured or answering.")); return; }
  for (const [name, h] of hs) {
    const d = el("div", "host"), t = el("h3", "", name); t.append(el("span", "hint", " " + (h.url || "")));
    d.append(t);
    if (!h.ok) { d.append(el("div", "hint", "unreachable: " + (h.error || ""))); box.append(d); continue; }
    d.append(table(["model", "state", "type", "context (loaded / max)", "quant"], (h.models || []).map(m =>
      [m.id, m.state === "loaded" ? "● loaded" : "not loaded", short(m.type), `${m.loaded_context_length ?? "-"} / ${m.max_context_length ?? "-"}`, short(m.quantization)])));
    box.append(d);
  }
}

// ---- attention ----
function drawAttention() {
  const pop = $("#attn-pop"); pop.textContent = "";
  if (!attention.length) { pop.append(el("div", "hint", "Nothing needs you right now.")); return; }
  for (const a of attention) {
    const run = a.run && allRuns.find(r => r.project === a.project && r.name === a.run);
    const it = el("div", "attn-item"), ic = el("div"); ic.innerHTML = (run ? iconOf(run, 22) : profileOf({}).icon("waiting", 22));
    const b = el("div"); b.append(el("div", "t", a.text || a.kind), el("div", "pj", [a.kind, a.run, projects.find(p => p.key === a.project)?.name || ""].filter(Boolean).join(" · ") + (a.ts ? " · " + ago(a.ts) : "")));
    it.append(ic, b);
    const ac = a.action, url = typeof ac === "string" ? ac : ac && (ac.url || (ac.type === "link" && ac.url));
    it.onclick = () => {
      $("#attn-pop").hidden = true;
      if (url && /^https?:\/\//.test(url)) window.open(url, "_blank", "noopener,noreferrer");
      else if (a.run) select(a.project, a.run);
      else if (a.project) selectProject(a.project);
    };
    if (ac && ac.type === "local_approve") {
      const bx = el("div", "actions");
      const decide = approve => async ev => {
        ev.stopPropagation();
        const res = await post("/api/local_approve", { p: a.project }, { run: ac.run, id: ac.id, approve });
        if (res.ok === false) alert(res.error || "failed");
        loadRuns(); loadAttention();
      };
      const y = el("button", "primary sm need-operate", "Approve"), n = el("button", "danger sm need-operate", "Deny");
      y.onclick = decide(true); n.onclick = decide(false); bx.append(y, n); b.append(bx);
    }
    pop.append(it);
  }
}
$("#attn").onclick = ev => { ev.stopPropagation(); const p = $("#attn-pop"); p.hidden = !p.hidden; if (!p.hidden) drawAttention(); };
document.addEventListener("click", ev => { if (!ev.target.closest("#attn-pop")) $("#attn-pop").hidden = true; });

// ---- resizable sidebar + shrink-to-fit run names ----
const side = $("#side");
function setSideW(w, save) {
  w = Math.max(200, Math.min(600, Math.round(w)));
  side.style.width = w + "px";
  if (save) LS.set("sideW", w);
  fitNames();
}
function fitNames() {
  for (const n of document.querySelectorAll("#runs .run .nm")) {
    n.style.fontSize = ""; n.title = "";
    if (isMob()) continue;
    if (n.scrollWidth <= n.clientWidth) continue;
    const base = parseFloat(getComputedStyle(n).fontSize);
    const k = Math.max(0.7, n.clientWidth / n.scrollWidth);
    n.style.fontSize = (base * k).toFixed(2) + "px";
    if (n.scrollWidth > n.clientWidth) n.title = n.textContent;
  }
}
{
  const w = LS.get("sideW", null);
  if (typeof w === "number") side.style.width = Math.max(200, Math.min(600, w)) + "px";
  const grip = $("#grip");
  grip.onpointerdown = e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add("drag");
    const x0 = e.clientX, w0 = side.getBoundingClientRect().width;
    grip.onpointermove = m => setSideW(w0 + m.clientX - x0, false);
    grip.onpointerup = () => { grip.onpointermove = grip.onpointerup = null; grip.classList.remove("drag"); setSideW(side.getBoundingClientRect().width, true); };
  };
  new ResizeObserver(fitNames).observe(side);
}

// ---- phone layout: list view <-> detail view, header menu, filter sheet ----
const mq = window.matchMedia("(max-width:640px)");
function isMob() { return mq.matches; }
function setDetail(on) { document.body.classList.toggle("mob-detail", on); if (!on) drawProjects(); }
function openDetail() {
  if (!document.body.classList.contains("mob-detail")) { try { history.pushState({ d: 1 }, ""); } catch {} }
  setDetail(true);
}
function closeDetail() { if (history.state && history.state.d) history.back(); else setDetail(false); }
window.addEventListener("popstate", () => setDetail(!!(history.state && history.state.d)));
try { if (history.state && history.state.d) history.replaceState(null, ""); } catch {}
$("#back").onclick = closeDetail;
const phText = $("#text").placeholder;
const fitMode = () => { $("#text").placeholder = mq.matches ? "Message this agent…" : phText; };
fitMode();
mq.addEventListener("change", () => { setDetail(false); fitNames(); fitMode(); });
const menuOpen = on => { $("#hdr").classList.toggle("menu-open", on); $("#menubtn").setAttribute("aria-expanded", on); if (on) $("#attn-pop").hidden = true; };
$("#menubtn").onclick = ev => { ev.stopPropagation(); menuOpen(!$("#hdr").classList.contains("menu-open")); };
$("#newbtn").addEventListener("click", () => menuOpen(false));
document.addEventListener("click", ev => { if (!ev.target.closest("#hmenu, #menubtn")) menuOpen(false); });
$("#attn").addEventListener("click", () => menuOpen(false));
const sheet = on => { $("#fbox").classList.toggle("open", on); $("#sheetbg").hidden = !on; };
$("#fbtn").onclick = () => sheet(true); $("#fdone").onclick = $("#sheetbg").onclick = () => sheet(false);
$("#psel").onchange = e => selectProject(e.target.value);
$("#runhead").addEventListener("click", ev => { if (isMob() && !ev.target.closest("button")) { rhOpen = !rhOpen; $("#runhead").classList.toggle("rhopen", rhOpen); } });
$("#l-thinkpane h3").addEventListener("click", () => { if (isMob()) $("#l-thinkpane").classList.toggle("open"); });
setTab("agents");

// ---- start ----
(async () => {
  // who am I: the Cloudflare Access listener limits what the user may do; the server enforces it, this only hides buttons
  const me = await jget("/api/me");
  if (me && me.level) {
    document.body.classList.add("lv-" + me.level);
    const w = $("#who"); w.hidden = false;
    w.textContent = (me.email || (me.lan ? "LAN" : "local")) + " · " + me.level;
  }
  await loadProjects();
  setNewBtn(); loadCfg(); loadSpend(); loadAttention(); loadLms();
  await loadRuns();
  const v = filterRuns(runs).filter(r => !r.parent)[0];
  if (v && !current) select(v.project, v.name, true);
})();
// ---- live update: the server's source changed -> reload this page (it keeps the selected run) ----
let build = null, reloadDue = false;
async function checkBuild() {
  const h = await jget("/api/health");
  if (!h || !h.build) return;
  if (build === null) build = h.build;
  else if (h.build !== build) reloadDue = true;
  if (!reloadDue) return;
  const busy = msgText() || pending.length || document.querySelector("dialog[open]");
  if (busy) { $("#hint").textContent = "The dashboard was updated: it reloads once this message is sent or cleared."; return; }
  try { sessionStorage.setItem("ac.reselect", JSON.stringify(current)); } catch {}
  location.reload();
}
try { const r = JSON.parse(sessionStorage.getItem("ac.reselect") || "null"); sessionStorage.removeItem("ac.reselect");
  if (r && r.name) setTimeout(() => select(r.project, r.name, true), 600); } catch {}
setInterval(checkBuild, 10000); checkBuild();
setInterval(loadRuns, 4000); setInterval(loadSpend, 8000); setInterval(loadProjects, 8000);
setInterval(loadAttention, 8000); setInterval(loadLms, 20000); setInterval(loadCfg, 60000);
</script>
