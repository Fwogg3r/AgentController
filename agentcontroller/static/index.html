<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<style>
/* Claude Code's terminal look: dark always. */
:root {
  --bg:#141413; --card:#1E1E1C; --ink:#E8E6E1; --muted:#8B8983; --line:#2E2D2A; --accent:#D97757; --accent-d:#C4623F;
  --bubble:transparent; --user:#2C2B28; --tool:transparent; --ok:#4EBA65; --bad:#FF6B80; --warn:#E5C07B;
  --shadow:none; color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column;
  font:13.5px/1.5 ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace; }
code,pre,.mono { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:12.5px; }
header { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; font-weight:600; letter-spacing:.2px; }
.spend { display:flex; gap:14px; align-items:center; flex:1; min-width:260px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
.bar { width:140px; height:8px; border-radius:6px; background:var(--line); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .4s; }
.bar.hot i { background:var(--bad); }
button { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px;
  padding:5px 11px; cursor:pointer; box-shadow:var(--shadow); }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary.armed { background:var(--accent-d); outline:2px solid var(--accent); }
button.danger:hover:not(:disabled) { border-color:var(--bad); color:var(--bad); }
main { flex:1; display:flex; min-height:0; }
#side { width:270px; flex:none; overflow:auto; scrollbar-gutter:stable; min-width:0; padding:10px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
#runs { display:flex; flex-direction:column; gap:8px; min-width:0; }
#sidewrap { position:relative; display:flex; flex:none; min-height:0; }
#grip { position:absolute; top:0; right:-3px; width:7px; height:100%; cursor:col-resize; z-index:5; }
#grip:hover, #grip.drag { background:var(--accent); opacity:.35; }
.run { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:9px 10px; cursor:pointer; box-shadow:var(--shadow);
  display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:center; }
.run.sel { border-color:var(--accent); }
.run > * { min-width:0; }
.run .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.run .meta { color:var(--muted); font-size:12px; }
.pill { display:inline-block; font-size:11px; padding:0 7px; border-radius:20px; color:#111; }
.pill.working { background:var(--ok); } .pill.waiting { background:var(--warn); } .pill.finished { background:var(--muted); }
.pill.oneshot { background:transparent; border:1px solid var(--accent); color:var(--accent); margin-right:4px; }
.pill.finished.max_tokens, .pill.finished.refusal { background:var(--warn); }
.pill.crashed { background:var(--bad); } .pill.ended { background:var(--line); color:var(--muted); }
.pill.finished.max_turns, .pill.finished.budget { background:var(--warn); } .pill.finished.error { background:var(--bad); }
.run .act { font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; grid-column:1 / -1; }
.run .act .g { color:var(--accent); }
#filters { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); padding-bottom:6px; border-bottom:1px solid var(--line); }
#filters input[type=text], #filters input[type=number] { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line);
  border-radius:6px; padding:3px 6px; width:100%; }
#filters input[type=number] { width:56px; }
#filters label { display:flex; align-items:center; gap:5px; cursor:pointer; }
#filters .two { display:flex; flex-wrap:wrap; gap:2px 10px; }
/* transcript */
.ln { white-space:pre-wrap; word-break:break-word; padding-left:2ch; text-indent:-2ch; cursor:pointer; }
.ln.sel { background:var(--user); }
.ln .b { color:var(--ink); } .ln.toolln .b { color:var(--ok); } .ln.toolln.err .b { color:var(--bad); } .ln.toolln.open .b { color:var(--muted); }
.ln .tn { font-weight:700; }
.res { color:var(--muted); white-space:pre-wrap; word-break:break-word; padding-left:5ch; text-indent:-3ch; max-height:7.5em; overflow:hidden; cursor:pointer; }
.res.full { max-height:none; }
.ln.user { background:var(--user); padding:4px 8px 4px calc(2ch + 8px); color:var(--ink); border-radius:4px; }
details.think { color:var(--muted); font-style:italic; padding-left:2ch; }
details.think summary { cursor:pointer; list-style:none; text-indent:-2ch; }
details.think div { white-space:pre-wrap; word-break:break-word; }
#spinner { padding:6px 14px; min-height:2.2em; border-top:1px solid var(--line); }
#spinner .g { color:var(--accent); display:inline-block; width:2ch; }
#spinner .v { color:var(--accent); }
#spinner .m { color:var(--muted); }
#spinner .x { display:block; color:var(--muted); font-style:italic; padding-left:2ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pane { flex:1; display:flex; flex-direction:column; min-width:0; }
#runhead { padding:8px 14px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); }
#runhead b { color:var(--ink); }
#runhead .commits { margin-top:2px; white-space:pre-wrap; }
#stream { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.bubble { background:var(--bubble); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px; max-width:92%;
  white-space:pre-wrap; word-break:break-word; box-shadow:var(--shadow); cursor:pointer; }
.bubble.sel { outline:2px solid var(--accent); }
.bubble.user { align-self:flex-end; background:var(--user); border-radius:14px 14px 4px 14px; border-color:var(--accent); }
.bubble .ts { display:block; color:var(--muted); font-size:11px; }
details.tool { background:var(--tool); border-radius:10px; padding:3px 10px; font-size:12.5px; border:1px solid var(--line); }
details.tool summary { cursor:pointer; list-style:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
details.tool summary::before { content:"> "; color:var(--accent); }
details[open].tool summary::before { content:"v "; }
details.tool .res { margin:4px 0; white-space:pre-wrap; color:var(--muted); }
details.tool.err summary { color:var(--bad); }
.sys { color:var(--muted); font-size:12px; }
.md { line-height:1.55; padding:2px 0 6px; }
.md h1,.md h2,.md h3,.md h4 { margin:10px 0 4px; font-size:14px; color:var(--accent); }
.md p { margin:4px 0; } .md ul,.md ol { margin:4px 0; padding-left:22px; }
.md pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; overflow:auto; white-space:pre; margin:6px 0; }
.md code { background:var(--card); padding:0 4px; border-radius:4px; } .md pre code { background:none; padding:0; }
.promptblk summary { cursor:pointer; color:var(--muted); } .promptblk pre { white-space:pre-wrap; word-break:break-word; margin:4px 0; max-height:40vh; overflow:auto; }
#composer { border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
textarea { width:100%; resize:vertical; min-height:54px; max-height:200px; font:inherit; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
textarea:focus { outline:2px solid var(--accent); border-color:var(--accent); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.hint { font-size:12px; color:var(--muted); }
#primarybox { padding:8px 14px; border-top:1px dashed var(--line); }
#primarybox summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
dialog { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  padding:16px 18px; width:min(560px,94vw); }
dialog::backdrop { background:rgba(0,0,0,.35); }
dialog h2 { margin:0 0 10px; font-size:16px; }
dialog label { display:block; font-size:12.5px; color:var(--muted); margin:8px 0 2px; }
dialog input, dialog select { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:6px 9px; }
dialog .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
dialog .err { color:var(--bad); font-size:12.5px; min-height:1.2em; margin-top:8px; white-space:pre-wrap; }
dialog .msg { white-space:pre-wrap; margin:6px 0; }
.actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.empty { margin:auto; text-align:center; color:var(--muted); }
/* Clawd */
.clawd { display:block; }
.clawd .eye { fill:#2B1A12; } .clawd .zz, .clawd .bang { display:none; font:bold 5px monospace; }
.clawd.running { animation:bob 1.1s ease-in-out infinite; }
.clawd.running .leg:nth-of-type(odd) { animation:step 1.1s steps(2) infinite; }
.clawd.finished .eye { display:none; } .clawd.finished .closed { display:block; } .clawd .closed { display:none; }
.clawd.finished .zz { display:block; fill:var(--muted); animation:zz 2.4s ease-in-out infinite; }
.clawd.waiting .zz { display:block; fill:var(--warn); animation:zz 2.4s ease-in-out infinite; }
.clawd.crashed .bang { display:block; fill:var(--bad); }
.clawd.crashed { filter:grayscale(.85); opacity:.7; }
.clawd.ended { filter:grayscale(.85); opacity:.5; }
@keyframes bob { 50% { transform:translateY(-2px); } }
@keyframes step { 50% { transform:translateY(-1px); } }
@keyframes zz { 50% { opacity:.3; transform:translateY(-1px); } }
@media (max-width:640px) {
  main { flex-direction:column; }
  #sidewrap { display:block; }
  #grip { display:none; }
  #side { width:auto !important; border-right:0; border-bottom:1px solid var(--line); max-height:40vh; }
  #runs { flex-direction:row; overflow:auto; }
  .run { min-width:190px; }
  .bar { width:90px; }
}
</style>
</head>
<body>
<header>
  <div id="logo"></div>
  <h1 id="title">Agents</h1>
  <button class="primary" id="newbtn">+ New agent</button>
  <div class="spend">
    <span title="all of api_usage.jsonl vs the cap">total <b id="sp-total">-</b> / <span id="sp-cap">-</span></span>
    <span class="bar" id="sp-bar"><i></i></span>
    <span title="since the session start">session <b id="sp-sess">-</b></span>
    <button id="billed" title="Calls tools/api_usage.py --json (lags by hours)">actual billed</button>
    <span id="billed-out" class="mono"></span>
  </div>
</header>
<main>
  <div id="sidewrap">
  <aside id="side">
    <div id="filters">
      <input type="text" id="f-name" placeholder="filter by name" autocomplete="off">
      <div class="two">
        <label><input type="checkbox" id="f-finished"> finished</label>
        <label><input type="checkbox" id="f-crashed"> crashed</label>
        <label><input type="checkbox" id="f-ended"> ended (no record)</label>
      </div>
      <div class="two">
        <label title="one-shot API calls (agentask) are shown unless this is on"><input type="checkbox" id="f-noneshot"> hide non-agentic</label>
      </div>
      <div class="two">
        <label title="finished/crashed runs quiet for over 24 h stay hidden"><input type="checkbox" id="f-recent"> last 24 h only</label>
        <label>show last <input type="number" id="f-n" min="1" step="1"></label>
      </div>
      <span id="f-hidden"></span>
    </div>
    <div id="runs"></div>
  </aside>
  <div id="grip" title="drag to resize"></div>
  </div>
  <section id="pane">
    <div id="runhead"></div>
    <div id="stream"><div class="empty">Select a run.</div></div>
    <div id="spinner"></div>
    <div id="composer">
      <textarea id="text" placeholder="Message for the selected run (or text to forward). Click a line to select it for forwarding."></textarea>
      <div class="row">
        <button class="primary" id="send">Send to agent</button>
        <button class="danger" id="stop">Stop after this turn</button>
        <button id="fwd">Forward to primary</button>
        <span class="hint" id="hint"></span>
      </div>
    </div>
    <details id="primarybox">
      <summary>Message primary session (the coordinator)</summary>
      <textarea id="ptext" placeholder="Goes to primary_inbox.jsonl; the coordinator is woken by tools/wait_primary.py"></textarea>
      <div class="row" style="margin-top:6px"><button class="primary" id="psend">Send to primary</button><span class="hint" id="phint"></span></div>
    </details>
  </section>
</main>
<dialog id="newdlg">
  <h2>New agent</h2>
  <div class="hint" id="headroom"></div>
  <label>Name (branch + worktree; a-z, 0-9, -)</label><input id="n-name" placeholder="my-task" autocomplete="off">
  <div class="two">
    <div><label>Base branch</label><select id="n-base"></select></div>
    <div><label>Model</label><select id="n-model"></select></div>
  </div>
  <div class="hint" id="n-modelnote"></div>
  <div class="two">
    <div><label>Budget (USD)</label><input id="n-budget" type="number" min="0.01" step="0.05" value="1"></div>
    <div><label>Max turns</label><input id="n-turns" type="number" min="1" step="1"></div>
  </div>
  <label>Brief file (briefs/, optional: overrides the text below)</label><select id="n-bfile"></select>
  <label>Brief text (saved to briefs/&lt;name&gt;.md)</label><textarea id="n-btext" placeholder="What should the agent do?"></textarea>
  <label>Resume session id (optional)</label><input id="n-resume" autocomplete="off">
  <div class="err" id="n-err"></div>
  <div class="row" style="margin-top:8px"><button class="primary" id="n-go">Launch</button><button id="n-cancel">Cancel</button></div>
</dialog>
<dialog id="confdlg">
  <h2 id="c-title"></h2><div class="msg" id="c-msg"></div>
  <div class="row"><button class="primary" id="c-ok">Confirm</button><button id="c-cancel">Cancel</button></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const usd = n => n == null ? "-" : "$" + Number(n).toFixed(2);

// Clawd: chunky orange body, two dark square eyes, little legs. 11x8 pixel grid.
function clawd(state, px) {
  const r = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${c || ""}/>`;
  const o = 'fill="#D97757"';
  const svg = `<svg class="clawd ${state}" viewBox="0 -2 11 10" width="${px}" height="${px * 10 / 11}" shape-rendering="crispEdges">
    ${r(1,1,9,4,o)}${r(0,3,1,2,o)}${r(10,3,1,2,o)}
    ${r(2,5,1,2,o).replace('<rect','<rect class="leg"')}${r(4,5,1,2,o).replace('<rect','<rect class="leg"')}
    ${r(6,5,1,2,o).replace('<rect','<rect class="leg"')}${r(8,5,1,2,o).replace('<rect','<rect class="leg"')}
    <g class="eye">${r(3,2,1,2,'class="eye"')}${r(7,2,1,2,'class="eye"')}</g>
    <g class="closed">${r(3,3,1,.5,'class="eye" style="display:block"')}${r(7,3,1,.5,'class="eye" style="display:block"')}</g>
    <text class="zz" x="9" y="0">z</text><text class="bang" x="9.2" y="0.5">!</text></svg>`;
  return svg;
}
$("#logo").innerHTML = clawd("running", 40);

let runs = [], current = null, es = null, selBubble = null, stick = true;
let openTools = {}, toolQueue = [];  // tool lines waiting for their result (by id; FIFO for old logs without ids)
let fetchedAt = Date.now(), skew = 0;  // skew: browser clock minus the server's local clock (event ts have no zone)
const acts = {};  // run name -> {kind, text, tokens, t0, upd, ...}: the activity the spinner shows

// ---- persisted sidebar filters ----
const LS = {
  get(k, d) { try { const v = localStorage.getItem("ac." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ac." + k, JSON.stringify(v)); } catch {} },
};
const filt = Object.assign({ name: "", finished: true, crashed: true, ended: false, recent: true, noneshot: false, n: 30 }, LS.get("filters", {}));
$("#f-name").value = filt.name; $("#f-n").value = filt.n;
for (const k of ["finished", "crashed", "ended", "recent", "noneshot"]) $("#f-" + k).checked = !!filt[k];
$("#filters").oninput = () => {
  filt.name = $("#f-name").value.trim(); filt.n = Math.max(1, parseInt($("#f-n").value) || 30);
  for (const k of ["finished", "crashed", "ended", "recent", "noneshot"]) filt[k] = $("#f-" + k).checked;
  LS.set("filters", filt); drawRuns();
};
function visibleRuns() {
  const out = []; let hidden = 0, kept = 0;
  for (const r of runs) {
    if (filt.name && !r.name.toLowerCase().includes(filt.name.toLowerCase())) { hidden++; continue; }
    if (r.oneshot && filt.noneshot && r.name !== current) { hidden++; continue; }
    if (r.active || r.name === current) { out.push(r); continue; }  // live runs are never filtered away
    const old = r.idle_seconds > 86400 && (r.state === "finished" || r.state === "crashed");
    if (!filt[r.state] || (filt.recent && old) || kept >= filt.n) { hidden++; continue; }
    kept++; out.push(r);
  }
  return [out, hidden];
}

// ---- spinner (Claude Code's glyphs and verbs) ----
const GLYPHS = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"];
const VERBS = ["Thinking", "Deliberating", "Pondering", "Ruminating", "Mulling", "Cogitating", "Considering", "Reasoning",
  "Musing", "Contemplating", "Noodling", "Percolating", "Brewing", "Synthesizing", "Puzzling"];
const glyph = () => GLYPHS[Math.floor(Date.now() / 120) % GLYPHS.length];
const verb = name => { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) | 0; return VERBS[Math.abs(h + Math.floor(Date.now() / 4000)) % VERBS.length]; };
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m";
}
const ktok = n => n == null ? null : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const tsMs = ts => new Date(ts).getTime() + skew;  // "YYYY-MM-DDTHH:MM:SS" parses as browser-local time
function actFrom(r) {
  const a = r.activity;
  if (!a) return null;
  const t0 = a.age != null ? fetchedAt - a.age * 1000 : Date.now();
  return { ...a, t0, upd: t0 };
}
// One-line description; `long` adds the elapsed/tokens suffix used by the main spinner.
function actLine(name, a) {
  if (!a) return "";
  const el_ = dur((Date.now() - a.t0) / 1000), tok = ktok(a.tokens);
  const meta = `(${el_}${tok ? " · ↓ " + tok + " tokens" : ""})`;
  switch (a.kind) {
    case "thinking": return [verb(name) + "…", meta];
    case "writing": return [(a.text && a.text.startsWith("writing ") ? "Preparing " + a.text.slice(8) : "Writing") + "…", meta];
    case "tool": return ["Running " + a.text + "…", meta];
    case "task": return ["Waiting for " + a.text, `(${el_})`];
    case "notification": case "inbox": case "rate_limit": case "retry": return ["Waiting: " + a.text, `(${el_})`];
    default: return [a.text || a.kind, ""];
  }
}
function drawSpinner() {
  const box = $("#spinner"), r = runs.find(x => x.name === current);
  box.textContent = "";
  if (!r) return;
  if (r.active) {
    const a = acts[r.name] || actFrom(r);
    const [main, meta] = actLine(r.name, a);
    const g = el("span", "g", r.state === "waiting" ? "·" : glyph());
    box.append(g, el("span", "v", main + " "), el("span", "m", meta));
    if (a && (a.kind === "thinking" || a.kind === "writing") && a.text && !a.text.startsWith("writing "))
      box.append(el("span", "x", a.text));
  } else if (r.state === "finished") {
    box.append(el("span", "m", `✓ finished · ${r.outcome} · ${usd(r.cost)} · ${r.turns} turns`));
  } else if (r.state === "crashed") {
    box.append(el("span", "v", "✗ crashed (process gone, no end record) "), el("span", "m", r.activity?.text || ""));
    if (r.activity?.log) box.append(el("span", "x", "log: " + r.activity.log));
  } else {
    box.append(el("span", "m", "ended (no record) · " + (r.activity?.text || "")));
  }
}
let actNodes = [];
setInterval(() => {
  drawSpinner();
  for (const [r, n] of actNodes) { const a = acts[r.name] || actFrom(r); n.textContent = actLine(r.name, a).join(" "); n.previousSibling.textContent = r.state === "waiting" ? "· " : glyph() + " "; }
}, 120);

// ---- run list ----
async function loadRuns() {
  try { runs = await (await fetch("/api/runs")).json(); } catch { return; }
  fetchedAt = Date.now();
  const ref = runs.find(r => r.last_activity);
  if (ref) skew = fetchedAt - ref.idle_seconds * 1000 - new Date(ref.last_activity).getTime();
  for (const r of runs) {
    const a = actFrom(r), old = acts[r.name];
    // A newer SSE-derived activity (between polls) wins over the poll's.
    acts[r.name] = old && a && old.upd > a.upd + 1500 ? old : a;
  }
  drawRuns();
}
function drawRuns() {
  const [vis, hidden] = visibleRuns();
  const box = $("#runs"); box.textContent = ""; actNodes = [];
  for (const r of vis) {
    const d = el("div", "run" + (r.name === current ? " sel" : ""));
    const g = el("div"); g.innerHTML = clawd(r.state === "working" ? "running" : r.state, 32);
    const t = el("div");
    t.append(el("div", "nm", r.name));
    const label = r.outcome && r.outcome !== "success" ? `${r.state} · ${r.outcome.replace("_", " ")}` : r.state === "ended" ? "ended (no record)" : r.state;
    const p = el("span", "pill " + r.state + " " + (r.outcome || ""), label);
    const m = el("div", "meta", `${(r.model || "?").replace("claude-", "")} · ${usd(r.cost)} · ` +
      (r.oneshot ? `${ktok(r.tokens_in) ?? "?"} in / ${ktok(r.tokens_out) ?? "?"} out` : `${r.turns} turns`));
    if (r.oneshot) t.append(el("span", "pill oneshot", "ask"));
    t.append(p, m);
    d.append(g, t);
    if (r.active) {
      const line = el("div", "act"), n = el("span");
      line.append(el("span", "g", glyph() + " "), n); d.append(line); actNodes.push([r, n]);
    } else if (r.state === "crashed") d.append(el("div", "act", "last: " + (r.activity?.text || "?")));
    d.title = r.activity?.text || "";
    d.onclick = () => select(r.name);
    box.append(d);
  }
  if (!runs.length) box.append(el("div", "hint", "No runs yet."));
  if (typeof fitNames === "function") fitNames();
  $("#f-hidden").textContent = hidden ? `${hidden} hidden by filters` : "";
  const r = runs.find(x => x.name === current);
  if (r) {
    const h = $("#runhead"); h.textContent = "";
    const b = el("div"); b.innerHTML = "<b></b> "; b.firstChild.textContent = r.name;
    b.append(r.oneshot ? `one-shot API call · effort ${r.effort || "?"} · ${usd(r.cost)} · ${ktok(r.tokens_in) ?? "?"} in / ${ktok(r.tokens_out) ?? "?"} out` +
      `${r.seconds != null ? " · " + dur(r.seconds) : ""}${r.backfilled ? " · imported from usage log" : ""}`
      : `${r.branch || "-"} · ${r.worktree ? "uncommitted: " + (r.dirty ?? "?") : "no worktree"}${r.legacy ? " · legacy log" : ""}`);
    h.append(b, el("div", "commits mono", (r.commits || []).join("\n")));
    const live = r.active;
    const act = el("div", "actions");
    const btn = (label, cls, fn, off) => { const x = el("button", cls, label); x.disabled = !!off; x.onclick = fn; act.append(x); };
    if (!r.oneshot) btn("Kill process tree", "danger", () => confirmThen("Kill " + r.name + "?",
      "Terminates the whole process tree immediately. Use only if a graceful stop did not work. The spend so far is logged.",
      () => act2("/api/kill", r.name)), !r.pid_alive);
    btn("Remove from list", "", () => confirmThen("Archive " + r.name + "?",
      "Moves its logs to agent_runs/archive/. The worktree and branch stay.", () => act2("/api/archive", r.name)), live);
    if (!r.oneshot) btn("Delete worktree", "danger", () => deleteWorktree(r.name), live || !r.worktree);
    h.append(act);
    $("#send").disabled = $("#stop").disabled = !live;
  }
  drawSpinner();
}

function select(name) {
  current = name; selBubble = null; openTools = {}; toolQueue = [];
  if (es) es.close();
  $("#stream").textContent = "";
  es = new EventSource("/api/stream?run=" + encodeURIComponent(name));
  es.onmessage = ev => { try { render(JSON.parse(ev.data)); } catch {} };
  drawRuns();
}

// ---- markdown (small, escape-first: headings, fences, lists, bold/italic, inline code) ----
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function mdInline(s) {
  return escHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
}
function mdToHtml(src) {
  const out = []; let list = null, para = [], fence = null;
  const endPara = () => { if (para.length) out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; };
  const endList = () => { if (list) out.push("</" + list + ">"); list = null; };
  for (const raw of src.split("\n")) {
    if (fence !== null) {
      if (/^\s*```/.test(raw)) { out.push("<pre><code>" + escHtml(fence) + "</code></pre>"); fence = null; }
      else fence += (fence ? "\n" : "") + raw;
      continue;
    }
    if (/^\s*```/.test(raw)) { endPara(); endList(); fence = ""; continue; }
    let m;
    if ((m = raw.match(/^(#{1,4})\s+(.*)/))) { endPara(); endList(); out.push("<h" + m[1].length + ">" + mdInline(m[2]) + "</h" + m[1].length + ">"); continue; }
    if ((m = raw.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
      endPara(); const t = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== t) { endList(); out.push("<" + t + ">"); list = t; }
      out.push("<li>" + mdInline(m[2]) + "</li>"); continue;
    }
    if (!raw.trim()) { endPara(); endList(); continue; }
    endList(); para.push(raw);
  }
  if (fence !== null) out.push("<pre><code>" + escHtml(fence) + "</code></pre>");
  endPara(); endList();
  return out.join("");
}
const curRun = () => runs.find(x => x.name === current);

// ---- transcript ----
function add(node) {
  const s = $("#stream");
  s.append(node);
  if (stick) s.scrollTop = s.scrollHeight;
}
function line(cls, bullet, text, ts) {
  const b = el("div", "ln " + cls);
  b.append(el("span", "b", bullet + " "), document.createTextNode(text));
  if (ts) b.title = ts.replace("T", " ");
  b.dataset.text = text;
  b.onclick = () => { if (selBubble) selBubble.classList.remove("sel"); selBubble = selBubble === b ? null : b; if (selBubble) b.classList.add("sel"); updateHint(); };
  return b;
}
// Live events from the stream move the spinner between polls (older replayed events don't).
function bump(e, a) {
  if (!e.ts) return;
  const t = tsMs(e.ts), cur = acts[current];
  if (cur && t < cur.upd) return;
  acts[current] = { ...a, upd: t, t0: a.keepT0 && cur && (cur.kind === "thinking" || cur.kind === "writing") ? cur.t0 : t };
}
function render(e) {
  switch (e.kind) {
    case "prompt": {
      const d = el("details", "promptblk"); d.open = true;
      const files = (e.files || []).map(f => f.path + " (" + f.bytes + " B)").join(", ");
      d.append(el("summary", "", "> prompt" + (files ? " · files: " + files : "") + (e.truncated ? " · truncated" : "")), el("pre", "", e.text));
      add(d); break;
    }
    case "text":
      if (curRun()?.oneshot) { const d = el("div", "md"); d.innerHTML = mdToHtml(e.text); add(d); break; }
      add(line("", "●", e.text, e.ts)); bump(e, { kind: "thinking", text: "", tokens: acts[current]?.tokens, keepT0: true }); break;
    case "user": add(line("user", ">", e.text, e.ts)); bump(e, { kind: "thinking", text: "" }); break;
    case "thinking": {
      const d = el("details", "think");
      d.append(el("summary", "", "✻ Thinking…"), el("div", "", e.text));
      add(d); break;
    }
    case "tool": {
      const blk = el("div", "toolblk");
      const l = line("toolln open", "●", "", e.ts);
      l.lastChild.remove();
      l.append(el("span", "tn", e.name), document.createTextNode(`(${e.arg || ""})`));
      l.dataset.text = `${e.name}(${e.arg || ""})`;
      blk.append(l); add(blk);
      if (e.id) openTools[e.id] = blk; else toolQueue.push(blk);
      bump(e, { kind: "tool", text: `${e.name}: ${e.arg || ""}`, tool: e.name });
      break;
    }
    case "tool_result": {
      const blk = (e.id && openTools[e.id]) || toolQueue.shift();
      if (e.id) delete openTools[e.id];
      if (blk) {
        const l = blk.firstChild; l.classList.remove("open"); if (!e.ok) l.classList.add("err");
        const res = el("div", "res", "⎿  " + (e.text || "(empty)"));
        res.onclick = () => res.classList.toggle("full");
        blk.append(res);
      }
      if (!Object.keys(openTools).length && !toolQueue.length) bump(e, { kind: "thinking", text: "" });
      break;
    }
    case "progress":
      bump(e, { kind: e.phase === "text" || e.phase === "tool_input" ? "writing" : "thinking",
        text: e.excerpt || (e.tool ? "writing " + e.tool + " call" : ""), tokens: e.tokens, keepT0: true });
      break;
    case "task":
      add(el("div", "sys", e.status === "started" ? `⧗ background task started: ${e.text || e.id}` : `⧗ background task ${e.status}${e.text ? ": " + e.text : ""}`));
      break;
    case "retry": add(el("div", "sys", `↻ API retry ${e.attempt}/${e.max_retries}: ${e.error || e.error_status || ""}`)); break;
    case "rate_limit": add(el("div", "sys", `rate limit ${e.status}${e.type ? " (" + e.type + ")" : ""}`)); break;
    case "start": add(el("div", "sys", e.oneshot ? `one-shot · ${(e.model || "").replace("claude-", "")} · effort ${e.effort || "?"}`
      : `started · ${(e.model || "").replace("claude-", "")} · budget ${usd(e.budget)} · ${e.brief || ""}`)); break;
    case "result": add(el("div", "sys", `turn done · ${usd(e.cost)} · ${e.turns} turns · ${e.subtype}`)); loadRuns(); break;
    case "end": add(el("div", "sys", e.killed ? "run stopped (killed)" : "run ended")); loadRuns(); break;
  }
}
$("#stream").addEventListener("scroll", () => { const s = $("#stream"); stick = s.scrollHeight - s.scrollTop - s.clientHeight < 40; });

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
const msgText = () => $("#text").value.trim();
function updateHint() { $("#hint").textContent = selBubble && !msgText() ? "Forward uses the selected line." : ""; }
$("#text").oninput = updateHint;

let armTimer = null;
$("#send").onclick = async () => {
  const b = $("#send"), t = msgText();
  if (!current || !t) return;
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Confirm send";
    $("#hint").textContent = "Delivered at the agent's next turn. Click again to send.";
    armTimer = setTimeout(disarm, 5000); return;
  }
  disarm();
  const r = await post("/api/inbox?run=" + encodeURIComponent(current), { text: t });
  $("#hint").textContent = r.ok ? "Queued: delivered at next turn." : "Failed: " + r.error;
  if (r.ok) $("#text").value = "";
};
function disarm() { clearTimeout(armTimer); const b = $("#send"); b.classList.remove("armed"); b.textContent = "Send to agent"; }
$("#stop").onclick = async () => {
  if (!current || !confirm("Stop " + current + " after its current turn?")) return;
  const r = await post("/api/inbox?run=" + encodeURIComponent(current), { control: "stop" });
  $("#hint").textContent = r.ok ? "Stop requested: ends after this turn." : "Failed: " + r.error;
};
$("#fwd").onclick = async () => {
  const t = msgText() || (selBubble && selBubble.dataset.text);
  if (!t) return;
  const r = await post("/api/primary", { run: current, text: t });
  $("#hint").textContent = r.ok ? "Forwarded to primary session." : "Failed: " + r.error;
  if (r.ok && msgText()) $("#text").value = "";
};
$("#psend").onclick = async () => {
  const t = $("#ptext").value.trim(); if (!t) return;
  const r = await post("/api/primary", { text: t });
  $("#phint").textContent = r.ok ? "Sent." : "Failed: " + r.error;
  if (r.ok) $("#ptext").value = "";
};

async function loadSpend() {
  try {
    const s = await (await fetch("/api/spend")).json();
    $("#sp-total").textContent = usd(s.total);
    $("#sp-cap").textContent = s.cap == null ? "no cap" : usd(s.cap);
    $("#sp-sess").textContent = usd(s.session);
    const pct = s.cap ? Math.min(100, 100 * s.total / s.cap) : 0;
    $("#sp-bar i").style.width = pct + "%"; $("#sp-bar").classList.toggle("hot", pct > 85);
  } catch {}
}
$("#billed").onclick = async () => {
  const o = $("#billed-out"); o.textContent = "asking..."; $("#billed").disabled = true;
  try { const r = await (await fetch("/api/billed")).json(); o.textContent = r.output.slice(0, 160); o.title = r.output; }
  catch (e) { o.textContent = String(e); }
  $("#billed").disabled = false;
};

// ---- confirm dialog, launch form, worktree delete ----
function confirmThen(title, msg, fn, okLabel) {
  $("#c-title").textContent = title; $("#c-msg").textContent = msg; $("#c-ok").textContent = okLabel || "Confirm";
  $("#c-ok").onclick = async () => { $("#confdlg").close(); await fn(); };
  $("#c-cancel").onclick = () => $("#confdlg").close();
  $("#confdlg").showModal();
}
async function act2(url, run, extra) {
  const r = await post(url + "?run=" + encodeURIComponent(run), extra || {});
  $("#hint").textContent = r.ok ? "Done." : "Failed: " + r.error;
  if (!r.ok) alert(r.error);
  await loadRuns(); await loadSpend();
  return r;
}
async function deleteWorktree(name) {
  const st = await (await fetch("/api/worktree?run=" + encodeURIComponent(name))).json();
  if (!st.ok) return alert(st.error);
  if (st.merged && !st.dirty) {
    return confirmThen("Delete worktree of " + name + "?", `Branch ${st.branch} is merged into ${st.base} and clean.\nRuns git worktree remove + branch -d.`,
      () => act2("/api/worktree_delete", name, {}));
  }
  confirmThen("Discard unmerged work of " + name + "?",
    `Branch ${st.branch} is NOT merged into ${st.base}.\nUncommitted files: ${st.dirty}\nUnmerged commits:\n${st.unmerged.join("\n") || "(none)"}\n\nThis permanently deletes the worktree and branch.`,
    () => act2("/api/worktree_delete", name, { discard: true }), "Discard unmerged work");
}
let cfgCache = null;
async function openNew() {
  cfgCache = await (await fetch("/api/config")).json();
  const c = cfgCache, fill = (sel, items, def) => { sel.textContent = ""; items.forEach(i => { const o = el("option", "", i); o.value = i; sel.append(o); }); if (def) sel.value = def; };
  fill($("#n-base"), c.branches, c.default_base);
  fill($("#n-model"), Object.keys(c.models), c.default_model);
  const bf = $("#n-bfile"); bf.textContent = ""; const none = el("option", "", "(none: use the text below)"); none.value = ""; bf.append(none);
  c.briefs.forEach(b => { const o = el("option", "", b); o.value = b; bf.append(o); });
  $("#n-turns").value = c.max_turns; $("#n-err").textContent = "";
  $("#headroom").textContent = c.cap == null ? "No cap configured." :
    `Headroom ${usd(c.headroom)} = cap ${usd(c.cap)} - logged ${usd(c.logged)} - active budgets ${usd(c.reserved)}`;
  modelNote(); $("#newdlg").showModal();
}
function modelNote() { const m = cfgCache.models[$("#n-model").value]; $("#n-modelnote").textContent = m ? `${m.id}: ${m.note || ""}` : ""; }
$("#n-model").onchange = modelNote;
$("#newbtn").onclick = openNew;
$("#n-cancel").onclick = () => $("#newdlg").close();
$("#n-go").onclick = async () => {
  const body = { name: $("#n-name").value.trim(), base: $("#n-base").value, model: $("#n-model").value,
    budget: $("#n-budget").value, max_turns: $("#n-turns").value, brief_file: $("#n-bfile").value,
    brief_text: $("#n-btext").value, resume: $("#n-resume").value.trim() };
  const r = await post("/api/launch", body);
  if (!r.ok) { $("#n-err").textContent = r.error; return; }
  $("#newdlg").close(); await loadRuns(); select(body.name); loadSpend();
};
// ---- resizable sidebar + shrink-to-fit run names ----
const side = $("#side");
function setSideW(w, save) {
  w = Math.max(200, Math.min(600, Math.round(w)));
  side.style.width = w + "px";
  if (save) LS.set("sideW", w);
  fitNames();
}
function fitNames() {
  for (const n of document.querySelectorAll("#runs .run .nm")) {
    n.style.fontSize = ""; n.title = "";
    if (n.scrollWidth <= n.clientWidth) continue;
    const base = parseFloat(getComputedStyle(n).fontSize);
    const k = Math.max(0.7, n.clientWidth / n.scrollWidth);
    n.style.fontSize = (base * k).toFixed(2) + "px";
    if (n.scrollWidth > n.clientWidth) n.title = n.textContent;   // still too long at the minimum: ellipsis + tooltip
  }
}
{
  const w = LS.get("sideW", null);
  if (typeof w === "number") side.style.width = Math.max(200, Math.min(600, w)) + "px";
  const grip = $("#grip");
  grip.onpointerdown = e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add("drag");
    const x0 = e.clientX, w0 = side.getBoundingClientRect().width;
    grip.onpointermove = m => setSideW(w0 + m.clientX - x0, false);
    grip.onpointerup = () => { grip.onpointermove = grip.onpointerup = null; grip.classList.remove("drag"); setSideW(side.getBoundingClientRect().width, true); };
  };
  new ResizeObserver(fitNames).observe(side);
}

fetch("/api/config").then(r => r.json()).then(c => { $("#title").textContent = c.project + " agents"; document.title = c.project + " agents"; });

loadRuns().then(() => { const v = visibleRuns()[0]; if (v.length && !current) select(v[0].name); });
loadSpend();
setInterval(loadRuns, 4000); setInterval(loadSpend, 8000);
</script>
